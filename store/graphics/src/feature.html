<!doctype html>
<meta charset="utf-8">
<!-- 플레이 스토어 그래픽 이미지(1024x500) 원본. 오른쪽 폰 화면은 raw/2-result.png -->
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/pretendard@1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css" media="print" onload="this.media='all'">
<style>
  html, body { margin: 0; width: 1024px; height: 500px; overflow: hidden; }
  body {
    position: relative; font-family: 'Pretendard Variable', sans-serif; color: #1D1D1F; letter-spacing: -.03em;
    background: radial-gradient(90% 120% at 0% 0%, #FFFFFF 0%, #F5F5F7 55%, #EAF2FF 100%);
  }
  .text { position: absolute; left: 72px; top: 50%; transform: translateY(-50%); display: grid; gap: 18px; }
  .logo { width: 96px; height: 96px; }
  h1 { margin: 6px 0 0; font-size: 64px; font-weight: 700; line-height: 1.1; }
  p { margin: 0; font-size: 27px; font-weight: 500; color: #6E6E73; line-height: 1.4; }
  p b { color: #0A6CF0; font-weight: 700; }
  .phone { position: absolute; right: 70px; top: 46px; width: 330px; padding: 9px; border-radius: 46px; background: #1D1D1F; box-shadow: 0 30px 60px -30px rgba(0, 0, 0, .45); }
  .phone img { display: block; width: 312px; border-radius: 38px; }
</style>
<body>
  <div class="text">
    <div id="logo"></div>
    <h1>성적계산기</h1>
    <p>점수만 넣으면 <b>최종 점수·등급</b>이 바로<br>목표 점수 · 내신 등급 · 학점 · 급식까지</p>
  </div>
  <div class="phone"><img src="raw/2-result.png" alt=""></div>
<script src="../../../docs/brand/brand-logo.js"></script>
<script>
  document.getElementById('logo').innerHTML = brandLogo(115).replace('<svg ', '<svg class="logo" ');
</script>
</body>
