# GitHub Pages(Jekyll)에 올리지 않을 것: 설계 문서, Worker 소스·테스트, 빌드 스크립트, 안드로이드 프로젝트, 스토어 자료.
# 사이트에 필요한 건 HTML·CSS·JS·이미지·assistant/kb.json뿐이다.
exclude:
  - docs
  - feedback-api
  - scripts
  - android
  - store
  - README.md
  - package.json
# 점으로 시작하는 폴더는 기본으로 빠지므로, 앱 인증 파일(Digital Asset Links)이 있는 .well-known은 꼭 넣는다.
include:
  - .well-known
