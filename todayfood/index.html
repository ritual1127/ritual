</head>
<body data-app="food">

  <header class="appbar">
    <div class="appbar-inner glass" data-mini="false">
      <a class="logo" href="/"><img class="logo-icon" src="/favicon.png?v=6" alt="" width="28" height="28"><span class="logo-text">성적계산기</span></a>
      <button type="button" class="tool-menu-btn" aria-expanded="false" aria-controls="toolMenu" aria-label="도구 메뉴"><svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><rect x="4" y="4" width="6.5" height="6.5" rx="1.8"/><rect x="13.5" y="4" width="6.5" height="6.5" rx="1.8"/><rect x="4" y="13.5" width="6.5" height="6.5" rx="1.8"/><rect x="13.5" y="13.5" width="6.5" height="6.5" rx="1.8"/></svg></button>
      <nav class="tools glass" id="toolMenu" aria-label="도구">
        <a class="tool" href="/"><span class="app-icon" data-app="score" aria-hidden="true"></span><span class="tool-name">수행·지필</span></a>
        <a class="tool" href="/target-score/"><span class="app-icon" data-app="target" aria-hidden="true"></span><span class="tool-name">목표점수</span></a>
        <a class="tool" href="/rank/"><span class="app-icon" data-app="rank" aria-hidden="true"></span><span class="tool-name">내신등급</span></a>
        <a class="tool" href="/gpa/"><span class="app-icon" data-app="gpa" aria-hidden="true"></span><span class="tool-name">학점</span></a>
        <a class="tool" href="/gpa-converter/"><span class="app-icon" data-app="convert" aria-hidden="true"></span><span class="tool-name">GPA 환산</span></a>
        <span class="tools-sep" aria-hidden="true"></span>
        <a class="tool" href="/todayfood/" aria-current="page"><span class="app-icon" data-app="food" aria-hidden="true"></span><span class="tool-name">급식</span></a>
        <a class="tool" href="/todayclass/"><span class="app-icon" data-app="class" aria-hidden="true"></span><span class="tool-name">시간표</span></a>
      </nav>
      <button type="button" class="bar-main" data-label="급식"><span class="bar-text"><span class="bar-label">급식</span><span class="bar-value"></span></span><span class="bar-badge" hidden></span></button>
      <button type="button" class="theme-toggle" aria-pressed="false" aria-label="다크 모드">
        <svg class="icon icon-moon" viewBox="0 0 24 24" aria-hidden="true"><path d="M20.5 14.2A8.5 8.5 0 0 1 9.8 3.5a8.5 8.5 0 1 0 10.7 10.7z"/></svg>
        <svg class="icon icon-sun" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4.2"/><path d="M12 2.5v2.2M12 19.3v2.2M4.6 4.6l1.6 1.6M17.8 17.8l1.6 1.6M2.5 12h2.2M19.3 12h2.2M4.6 19.4l1.6-1.6M17.8 6.2l1.6-1.6"/></svg>
      </button>
    </div>
  </header>

  <main id="main" class="page page-narrow">
    <header class="page-head">
      <h1>오늘의 급식</h1>
    </header>

    <div class="seg" id="modeSeg" role="group" aria-label="급식 종류">
      <button type="button" data-mode="school" aria-pressed="true">학교 급식</button>
      <button type="button" data-mode="campus" aria-pressed="false">대학 학식</button>
    </div>

    <section class="card mt" id="schoolPicker" aria-label="학교 선택"></section>
    <section class="card mt" id="campusPicker" aria-label="대학 선택" hidden></section>

    <section class="card mt" id="mealBox" aria-labelledby="dateLabel" hidden>
      <div class="date-nav">
        <button type="button" class="icon-btn nav-btn" id="prevDayBtn" aria-label="전날 급식"><svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M15 5l-7 7 7 7"/></svg></button>
        <h2 class="date-label" id="dateLabel"></h2>
        <button type="button" class="icon-btn nav-btn" id="nextDayBtn" aria-label="다음날 급식"><svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M9 5l7 7-7 7"/></svg></button>
      </div>
      <div class="today-row"><button type="button" class="btn-ghost btn-sm" id="todayBtn" hidden>오늘로 돌아가기</button></div>
      <div class="seg mt" id="mealTabs" role="group" aria-label="끼니" hidden></div>
      <div id="dishList" aria-live="polite"></div>
      <div class="switch-row" id="notifyRow">
        <button type="button" class="switch" id="notifyToggleBtn" aria-pressed="false"><span class="switch-track" aria-hidden="true"></span><span id="notifyLabel">급식 알림 받기</span></button>
        <p class="switch-hint" id="notifyHint" aria-live="polite">매일 오전 11시 30분에 오늘 중식을 알려드려요. iOS는 홈 화면에 추가해야 알림이 와요.</p>
      </div>
    </section>
  </main>

  <footer class="site-footer">
    <p>학교 급식은 NEIS 교육정보 개방포털 데이터를, 대학 학식은 각 대학 홈페이지 식단을 기반으로 제공돼요.</p>
    <nav class="footer-links" aria-label="사이트 정보"><a href="/blog/">계산 가이드</a><a href="/faq/">자주 묻는 질문</a><a href="/guide/">사용법</a><a href="/privacy/">개인정보처리방침</a><a href="/service-intro.pdf" download="성적계산기_서비스소개서.pdf">서비스 소개서(PDF)</a></nav>
    <p class="copyright">© 2026 성적 계산기</p>
  </footer>

  <script src="../neis-common.js?v=20261025g"></script>
  <script>
    (() => {
      const $ = id => document.getElementById(id);
      const DEFAULT_HINT = $('notifyHint').textContent;
      let school = null;
      let currentDate = new Date();
      let mealCode = defaultMealCode();
      let slots = [];
      let requestId = 0;
      // 대학 학식: 서버(feedback-api)가 학교 홈페이지 식단을 읽어 식당별로 모아 준다
      const CAMPUSES = [['snu', '서울대학교'], ['kaist', 'KAIST'], ['pnu', '부산대학교'], ['knu', '경북대학교']];
      const stored = key => { try { return localStorage.getItem(key); } catch { return null; } };
      const store = (key, value) => { try { value ? localStorage.setItem(key, value) : localStorage.removeItem(key); } catch {} };
      const queryCampus = new URLSearchParams(location.search).get('u');
      const known = id => CAMPUSES.some(([key]) => key === id);
      let campus = known(queryCampus) ? queryCampus : known(stored('campus')) ? stored('campus') : null;
      let mode = queryCampus && campus ? 'campus' : stored('mealMode') === 'campus' ? 'campus' : 'school';
      const pushOk = 'serviceWorker' in navigator && 'PushManager' in window && 'Notification' in window;

      const el = (tag, className, text) => {
        const node = document.createElement(tag);
        if (className) node.className = className;
        if (text != null) node.textContent = text;
        return node;
      };

      function status(text) {
        $('dishList').replaceChildren(Object.assign(document.createElement('p'), { className: 'status', textContent: text }));
      }

      // 식당 하나: 이름(운영 시간) 아래로 메뉴 이름·가격, 반찬은 한 줄로
      function placeView({ name, meal }) {
        const box = el('section', 'campus-place');
        const head = el('h3', 'campus-place-name', name);
        if (meal.time) head.append(el('span', 'campus-time', meal.time));
        const list = el('ul', 'campus-menus');
        for (const menu of meal.menus) {
          // 이름 없는 메뉴(반찬만)는 반찬 줄을 이름 자리에. 첫 칸이 이름이어야 가격이 오른쪽 칸에 선다
          const item = el('li');
          item.append(el('span', 'campus-menu', menu.name || menu.dishes.join(' · ')));
          if (menu.price) item.append(el('span', 'campus-price', menu.price));
          if (menu.name && menu.dishes.length) item.append(el('span', 'campus-dishes', menu.dishes.join(' · ')));
          list.append(item);
        }
        box.append(head, list);
        return box;
      }

      function renderDate() {
        const dayOf = date => new Date(date.getFullYear(), date.getMonth(), date.getDate());
        const offset = Math.round((dayOf(currentDate) - dayOf(new Date())) / 86400000);
        const sub = Object.assign(document.createElement('span'), { className: 'date-sub', textContent: { '-1': '어제', 0: '오늘', 1: '내일' }[offset] || '' });
        $('dateLabel').replaceChildren(neisDateLabel(currentDate), sub);
        $('todayBtn').hidden = offset === 0;
      }

      function renderSlot() {
        $('mealTabs').querySelectorAll('button').forEach(button => button.setAttribute('aria-pressed', String(button.dataset.code === mealCode)));
        const slot = slots.find(item => item.code === mealCode);
        if (slot?.places) return $('dishList').replaceChildren(...slot.places.map(placeView));
        if (!slot || !slot.items.length) return status('급식 정보가 없어요.');
        const list = Object.assign(document.createElement('ul'), { className: 'dish-list' });
        list.append(...slot.items.map(item => Object.assign(document.createElement('li'), { textContent: item })));
        $('dishList').replaceChildren(list);
      }

      async function loadMeal() {
        renderDate();
        $('mealTabs').hidden = true;
        status('불러오는 중…');
        const id = ++requestId;
        if (mode === 'campus') {
          const ymd = neisYmd(currentDate);
          const data = await fetch(`${window.SITE_API}/campus-meal?u=${campus}&date=${ymd.slice(0, 4)}-${ymd.slice(4, 6)}-${ymd.slice(6)}`).then(res => res.json()).catch(() => null);
          if (id !== requestId) return;
          if (data?.link && $('campusHome')) Object.assign($('campusHome'), { href: data.link, hidden: false });
          if (!data?.places) return status(data?.error || '학식을 불러오지 못했어요. 잠시 후 다시 시도해 주세요.');
          // 끼니마다 그 끼니가 있는 식당만 모은다(코드는 학교 급식과 같은 1·2·3)
          slots = Object.values(MEAL_LABELS).map((label, i) => ({
            code: String(i + 1), label,
            places: data.places.map(place => ({ name: place.name, meal: place.meals.find(meal => meal.label === label) })).filter(place => place.meal)
          })).filter(slot => slot.places.length);
          if (!slots.length) return status('이 날은 학식 정보가 없어요. (주말·방학 등)');
        } else {
          const result = await fetchNeisMeal(school, neisYmd(currentDate)).catch(() => null);
          if (id !== requestId) return;
          if (!result) return status('급식 정보를 불러오지 못했어요. 잠시 후 다시 시도해 주세요.');
          slots = result.slots;
          if (!slots.length) return status('이 날은 급식 정보가 없어요. (주말·방학 등)');
        }
        if (!slots.some(item => item.code === mealCode)) mealCode = slots[0].code;
        $('mealTabs').replaceChildren(...slots.map(item => {
          const button = Object.assign(document.createElement('button'), { type: 'button', textContent: item.label });
          button.dataset.code = item.code;
          return button;
        }));
        $('mealTabs').hidden = false;
        renderSlot();
      }

      function moveDay(days) {
        currentDate = new Date(currentDate.getFullYear(), currentDate.getMonth(), currentDate.getDate() + days);
        loadMeal();
      }
      $('prevDayBtn').onclick = () => moveDay(-1);
      $('nextDayBtn').onclick = () => moveDay(1);
      $('todayBtn').onclick = () => { currentDate = new Date(); mealCode = defaultMealCode(); loadMeal(); };
      $('mealTabs').addEventListener('click', event => {
        const button = event.target.closest('button');
        if (!button) return;
        mealCode = button.dataset.code;
        renderSlot();
      });

      // --- 급식 알림 (Web Push) ---
      const PUSH_API = 'https://seongjeok-feedback-api.smilepea.workers.dev';
      const VAPID_PUBLIC_KEY = 'BMK5uCsTJJQZYXyFmwW-tepqmX-uldSkUa4GWijuK7TB_MXeU8ZYZYS5KLeWYpPsijZ_SVeZhlCcyqwMQBJHNxA';
      const notifyButton = $('notifyToggleBtn');

      function urlBase64ToUint8Array(base64Url) {
        const padding = '='.repeat((4 - base64Url.length % 4) % 4);
        const base64 = (base64Url + padding).replace(/-/g, '+').replace(/_/g, '/');
        return Uint8Array.from([...atob(base64)].map(c => c.charCodeAt(0)));
      }
      // 서비스워커가 준비되지 않으면 영원히 기다리지 않고 5초 뒤 포기한다.
      function workerReady() {
        return Promise.race([navigator.serviceWorker.ready, new Promise((_, reject) => setTimeout(() => reject(new Error('sw-timeout')), 5000))]);
      }
      function setNotify(on) {
        notifyButton.setAttribute('aria-pressed', String(on));
        $('notifyLabel').textContent = on ? '급식 알림 켜짐' : '급식 알림 받기';
      }

      async function refreshNotify() {
        if (!pushOk) return;
        try { setNotify(!!(await (await workerReady()).pushManager.getSubscription())); } catch { setNotify(false); }
      }

      async function enableNotify() {
        const permission = await Notification.requestPermission();
        if (permission !== 'granted') { $('notifyHint').textContent = '알림을 켜려면 브라우저 설정에서 알림 권한을 허용해 주세요.'; return; }
        const registration = await workerReady();
        const subscription = await registration.pushManager.subscribe({ userVisibleOnly: true, applicationServerKey: urlBase64ToUint8Array(VAPID_PUBLIC_KEY) });
        await saveNotifySchool(school);
        await fetch(`${PUSH_API}/subscribe`, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ subscription: subscription.toJSON() }) }).catch(() => {});
        setNotify(true);
        $('notifyHint').textContent = DEFAULT_HINT;
      }

      async function disableNotify() {
        const registration = await workerReady();
        const subscription = await registration.pushManager.getSubscription();
        if (subscription) {
          await fetch(`${PUSH_API}/unsubscribe`, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ endpoint: subscription.endpoint }) }).catch(() => {});
          await subscription.unsubscribe();
        }
        await clearNotifySchool();
        setNotify(false);
        $('notifyHint').textContent = DEFAULT_HINT;
      }

      notifyButton.addEventListener('click', async () => {
        if (!school) return;
        notifyButton.disabled = true;
        try {
          if (notifyButton.getAttribute('aria-pressed') === 'true') await disableNotify();
          else await enableNotify();
        } catch {
          $('notifyHint').textContent = '알림 설정에 실패했어요. 잠시 후 다시 시도해 주세요.';
        } finally {
          notifyButton.disabled = false;
        }
      });

      // 대학 고르기: 고르기 전엔 학교 칩, 고른 뒤엔 학교 카드(홈페이지·학교 변경)
      function renderCampusPicker() {
        const box = $('campusPicker');
        const name = (CAMPUSES.find(([id]) => id === campus) || [])[1];
        $('mealBox').hidden = !name;
        if (!name) {
          document.title = '오늘의 학식 - 대학 학식 메뉴 조회 | 성적 계산기';
          const picks = el('div', 'seg mt');
          for (const [id, label] of CAMPUSES) {
            const button = el('button', '', label);
            button.type = 'button';
            button.onclick = () => { campus = id; store('campus', id); renderCampusPicker(); };
            picks.append(button);
          }
          box.replaceChildren(el('h2', 'card-title', '대학 고르기'), picks, el('p', 'campus-note', '지금은 이 네 학교의 학식을 볼 수 있어요. 다른 대학이 필요하면 문의하기로 알려 주세요.'));
          return;
        }
        const card = el('div', 'school-card');
        const info = el('div', 'school-info');
        info.append(el('strong', '', name), el('span', 'school-meta', '학교 홈페이지 식단을 옮겨 보여 줘요'));
        const actions = el('div', 'school-actions');
        const home = Object.assign(el('a', 'btn-ghost btn-sm', '홈페이지'), { id: 'campusHome', target: '_blank', rel: 'noopener', hidden: true });
        const change = Object.assign(el('button', 'btn-ghost btn-sm', '학교 변경'), { type: 'button' });
        change.onclick = () => { campus = null; store('campus', null); history.replaceState(null, '', location.pathname); renderCampusPicker(); };
        actions.append(home, change);
        card.append(info, actions);
        box.replaceChildren(card);
        document.title = `오늘의 학식 - ${name} 학식 메뉴 | 성적 계산기`;
        loadMeal();
      }

      // 학교 급식 ↔ 대학 학식. 급식 알림은 학교 급식에만 있다
      function applyMode() {
        $('modeSeg').querySelectorAll('button').forEach(button => button.setAttribute('aria-pressed', String(button.dataset.mode === mode)));
        document.querySelector('.page-head h1').textContent = mode === 'campus' ? '오늘의 학식' : '오늘의 급식';
        $('schoolPicker').hidden = mode !== 'school';
        $('campusPicker').hidden = mode !== 'campus';
        $('notifyRow').hidden = mode !== 'school' || !pushOk;
      }
      $('modeSeg').addEventListener('click', event => {
        const next = event.target.closest('button')?.dataset.mode;
        if (!next || next === mode) return;
        mode = next;
        store('mealMode', mode === 'campus' ? 'campus' : null);
        applyMode();
        if (mode === 'campus') return renderCampusPicker();
        $('mealBox').hidden = !school;
        document.title = school ? `오늘의 급식 - ${school.schoolName} 급식표 | 성적 계산기` : '오늘의 급식 - 우리학교 급식표 조회 | 성적 계산기';
        if (school) loadMeal();
      });

      renderSchoolPicker($('schoolPicker'), picked => {
        school = picked;
        if (mode !== 'school') return;
        $('mealBox').hidden = !picked;
        document.title = picked ? `오늘의 급식 - ${picked.schoolName} 급식표 | 성적 계산기` : '오늘의 급식 - 우리학교 급식표 조회 | 성적 계산기';
        if (picked) loadMeal();
      });
      applyMode();
      if (mode === 'campus') renderCampusPicker();
      refreshNotify();
    })();
  </script>
</body>
</html>
