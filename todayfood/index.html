  <meta name="keywords" content="오늘의 급식, 급식표, 학교 급식, 급식 메뉴 조회, 우리학교 급식">

  <meta property="og:description" content="학교 이름만 검색하면 오늘의 급식 메뉴를 바로 확인할 수 있어요.">
  <meta property="og:url" content="https://naver1.cloud/todayfood/">

  <link rel="stylesheet" href="../styles.css">
</head>
<body>

  <div class="top-bar">
    <h1><span>오늘의</span> 급식</h1>
  </div>
  <p class="tagline">우리 학교 급식 메뉴를 검색 한 번으로 확인하세요</p>

  <div class="nav-tabs">
    <a class="nav-tab" href="../index.html">계산기</a>
    <a class="nav-tab active" href="./">급식</a>
    <a class="nav-tab" href="../todayclass/">시간표</a>
  </div>

  <div class="box" id="schoolPicker"></div>

  <div class="box" id="mealBox" style="display:none;">
    <div class="date-nav">
      <button type="button" class="btn-outline" id="prevDayBtn">◀</button>
      <span class="date-label" id="dateLabel"></span>
      <button type="button" class="btn-outline" id="nextDayBtn">▶</button>
    </div>
    <div class="meal-tabs" id="mealTabs"></div>
    <div id="dishList"><div class="empty-hint">학교를 선택하면 급식이 표시돼요.</div></div>

    <div class="notify-row">
      <button type="button" class="mini-btn" id="notifyToggleBtn">🔔 급식 알림 받기</button>
      <span class="notify-hint">매일 오전 11시 30분에 오늘 중식을 알려드려요. (iOS는 홈 화면에 추가해야 백그라운드에서도 알림이 와요)</span>
    </div>
  </div>

  <div style="text-align:center; margin:16px 0;">
    <ins class="kakao_ad_area" style="display:none;"
    data-ad-unit = "DAN-qFgxh1fm4CIwM4Ry"
    data-ad-width = "320"
    data-ad-height = "50"></ins>
  </div>

  <footer class="site-footer">
    오늘의 급식 · NEIS 교육정보 개방포털 데이터를 기반으로 제공됩니다.<br>
    © 2026 성적 계산기. All rights reserved.
  </footer>
  <div class="footer-links">
    <a href="../guide/">사용법 안내</a>·
    <a href="../blog/">블로그</a>·
    <a href="../privacy/">개인정보처리방침</a>
  </div>

  <script src="../neis-common.js"></script>
  <script>
    let currentDate = new Date();
    let currentMealCode = defaultMealCode();
    let currentSlots = [];

    function renderTabsActive() {
      document.querySelectorAll('#mealTabs button').forEach(b => b.classList.toggle('active', b.dataset.code === currentMealCode));
    }

    function renderMealSlot() {
      const listEl = document.getElementById('dishList');
      const slot = currentSlots.find(s => s.code === currentMealCode);
      listEl.innerHTML = slot && slot.items.length
        ? `<ul class="dish-list">${slot.items.map(i => `<li>${i}</li>`).join('')}</ul>`
        : '<div class="empty-hint">급식 정보가 없습니다.</div>';
    }

    async function renderMeal(school) {
      document.getElementById('dateLabel').textContent = neisDateLabel(currentDate);
      const listEl = document.getElementById('dishList');
      const tabsEl = document.getElementById('mealTabs');
      listEl.innerHTML = '<div class="empty-hint">불러오는 중...</div>';
      tabsEl.innerHTML = '';

      const result = await fetchNeisMeal(school, neisYmd(currentDate)).catch(() => ({ slots: [] }));
      currentSlots = result.slots;
      if (!currentSlots.length) {
        listEl.innerHTML = '<div class="empty-hint">이 날짜엔 급식 정보가 없어요. (주말·방학 등)</div>';
        return;
      }
      if (!currentSlots.some(s => s.code === currentMealCode)) currentMealCode = currentSlots[0].code;
      tabsEl.innerHTML = currentSlots.map(s => `<button type="button" data-code="${s.code}">${s.label}</button>`).join('');
      tabsEl.querySelectorAll('button').forEach(b => b.onclick = () => { currentMealCode = b.dataset.code; renderTabsActive(); renderMealSlot(); });
      renderTabsActive();
      renderMealSlot();
    }

    document.getElementById('prevDayBtn').onclick = () => {
      currentDate.setDate(currentDate.getDate() - 1);
      renderMeal(loadNeisSchool());
    };
    document.getElementById('nextDayBtn').onclick = () => {
      currentDate.setDate(currentDate.getDate() + 1);
      renderMeal(loadNeisSchool());
    };

    // --- 급식 알림 (Web Push) ---
    const PUSH_API = 'https://seongjeok-feedback-api.smilepea.workers.dev';
    const VAPID_PUBLIC_KEY = 'BMK5uCsTJJQZYXyFmwW-tepqmX-uldSkUa4GWijuK7TB_MXeU8ZYZYS5KLeWYpPsijZ_SVeZhlCcyqwMQBJHNxA';

    function urlBase64ToUint8Array(base64Url) {
      const padding = '='.repeat((4 - base64Url.length % 4) % 4);
      const base64 = (base64Url + padding).replace(/-/g, '+').replace(/_/g, '/');
      const raw = atob(base64);
      return Uint8Array.from([...raw].map(c => c.charCodeAt(0)));
    }

    function setNotifyBtnState(subscribed) {
      const btn = document.getElementById('notifyToggleBtn');
      btn.classList.toggle('active', subscribed);
      btn.textContent = subscribed ? '🔔 알림 켜짐 (끄려면 클릭)' : '🔔 급식 알림 받기';
    }

    async function refreshNotifyBtnState() {
      if (!('serviceWorker' in navigator) || !('PushManager' in window)) {
        document.getElementById('notifyToggleBtn').style.display = 'none';
        return;
      }
      const reg = await navigator.serviceWorker.ready;
      const sub = await reg.pushManager.getSubscription();
      setNotifyBtnState(!!sub);
    }

    async function enableMealNotify(school) {
      const permission = await Notification.requestPermission();
      if (permission !== 'granted') { alert('알림을 켜려면 브라우저 설정에서 권한을 허용해주세요.'); return; }
      const reg = await navigator.serviceWorker.ready;
      const sub = await reg.pushManager.subscribe({
        userVisibleOnly: true,
        applicationServerKey: urlBase64ToUint8Array(VAPID_PUBLIC_KEY)
      });
      await saveNotifySchool(school);
      await fetch(`${PUSH_API}/subscribe`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ subscription: sub.toJSON() })
      }).catch(() => {});
      setNotifyBtnState(true);
    }

    async function disableMealNotify() {
      const reg = await navigator.serviceWorker.ready;
      const sub = await reg.pushManager.getSubscription();
      if (sub) {
        await fetch(`${PUSH_API}/unsubscribe`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ endpoint: sub.endpoint })
        }).catch(() => {});
        await sub.unsubscribe();
      }
      await clearNotifySchool();
      setNotifyBtnState(false);
    }

    document.getElementById('notifyToggleBtn').onclick = async () => {
      const school = loadNeisSchool();
      if (!school) { alert('먼저 학교를 선택해주세요.'); return; }
      const reg = await navigator.serviceWorker.ready;
      const sub = await reg.pushManager.getSubscription();
      try {
        if (sub) await disableMealNotify();
        else await enableMealNotify(school);
      } catch {
        alert('알림 등록에 실패했어요. 잠시 후 다시 시도해주세요.');
      }
    };

    renderSchoolPicker(document.getElementById('schoolPicker'), (school) => {
      document.title = `오늘의 급식 - ${school.schoolName} 급식표 | 성적 계산기`;
      document.getElementById('mealBox').style.display = 'block';
      renderMeal(school);
    });
    refreshNotifyBtnState();
  </script>
  <script type="text/javascript" src="//t1.kakaocdn.net/kas/static/ba.min.js" async></script>
</body>
</html>
