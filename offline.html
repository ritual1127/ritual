<!doctype html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>인터넷 연결 없음 | 성적 계산기</title>
  <meta name="theme-color" content="#F5F5F7">
  <style>
    :root { color-scheme: light dark; --bg: #F5F5F7; --ink: #1D1D1F; --ink-2: #6E6E73; --btn: #0066CC; }
    @media (prefers-color-scheme: dark) { :root { --bg: #000; --ink: #F5F5F7; --ink-2: #A1A1A6; --btn: #0071E3; } }
    body {
      margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 24px;
      background: var(--bg); color: var(--ink); text-align: center; word-break: keep-all;
      font: 17px/1.5 -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Pretendard Variable", Pretendard, system-ui, "Malgun Gothic", sans-serif;
    }
    img { width: 64px; height: 64px; border-radius: 15px; }
    h1 { margin: 20px 0 8px; font-size: 22px; font-weight: 600; }
    p { margin: 0; color: var(--ink-2); font-size: 15px; }
    button { margin-top: 24px; min-height: 44px; padding: 0 24px; border: 0; border-radius: 999px; background: var(--btn); color: #fff; font: inherit; font-size: 16px; }
  </style>
</head>
<body>
  <main>
    <img src="/icon-192.png" alt="">
    <h1>인터넷에 연결되어 있지 않아요</h1>
    <p>전에 열어 본 계산기는 연결 없이도 쓸 수 있어요.<br>연결되면 자동으로 다시 불러와요.</p>
    <button type="button" onclick="location.reload()">다시 시도</button>
  </main>
  <script>addEventListener('online', () => location.reload());</script>
</body>
</html>
