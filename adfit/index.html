    <textarea id="reportInput" placeholder="[카카오애드핏 데일리 리포트]

▶︎ 조회일:  2026년 7월 26일 (Sun)

✓ 예상 적립금 : 4,407원  (+3,980.56%)
+ 요청수 : 62,645 (+4,911.6%)
..."></textarea>

  <div id="dashboard" style="display:none;">

      <div style="display:flex; justify-content:space-between; font-size:14px; color:var(--muted);">

    <div class="box">

  <script>
    const STORAGE_KEY = 'adfitReports';
    const METRICS = [
      { key: 'estimate', label: '예상 적립금', unit: '원', color: '#4f46e5' },
      { key: 'requests', label: '요청수', unit: '', color: '#0ea5e9' },
      { key: 'impressions', label: '노출수', unit: '', color: '#f59e0b' },
      { key: 'rendered', label: '렌더드 노출수', unit: '', color: '#8b5cf6' },
      { key: 'clicks', label: '클릭수', unit: '', color: '#ec4899' },
      { key: 'ctr', label: 'CTR', unit: '%', color: '#10b981' },
      { key: 'ecpm', label: 'eCPM', unit: '원', color: '#ef4444' },
    ];

    function loadReports() {
      try { return JSON.parse(localStorage.getItem(STORAGE_KEY) || '[]'); }
      catch { return []; }
    }
    function saveReports(list) { localStorage.setItem(STORAGE_KEY, JSON.stringify(list)); }

    function num(str) {
      if (str == null) return null;
      const n = parseFloat(str.replace(/[,%]/g, ''));
      return isNaN(n) ? null : n;
    }

    // Exact label -> field key. Order matters: longer labels ("렌더드 노출수") are matched
    // before their substrings ("노출수") by checking full-line equality, not substring search.
    const LINE_FIELDS = [
      ['예상 적립금', 'estimate'],
      ['요청수', 'requests'],
      ['렌더드 노출수', 'rendered'],
      ['노출수', 'impressions'],
      ['클릭수', 'clicks'],
      ['CTR', 'ctr'],
      ['eCPM', 'ecpm'],
    ];

    function parseReport(text) {
      const dateMatch = text.match(/조회일\s*:\s*(\d{4})년\s*(\d{1,2})월\s*(\d{1,2})일/);
      if (!dateMatch) return null;
      const date = `${dateMatch[1]}-${String(dateMatch[2]).padStart(2, '0')}-${String(dateMatch[3]).padStart(2, '0')}`;

      const result = { date, savedAt: Date.now() };
      const lines = text.split('\n');
      for (const rawLine of lines) {
        const line = rawLine.replace(/^[✓+\-\s]+/, '').trim();
        for (const [label, key] of LINE_FIELDS) {
          if (!line.startsWith(label)) continue;
          const rest = line.slice(label.length);
          if (!/^\s*:/.test(rest)) continue;
          const valueMatch = rest.match(/:\s*([\d,\.]+)/);
          const deltaMatch = rest.match(/\(([+\-][\d,\.]+)%\)/);
          result[key] = valueMatch ? num(valueMatch[1]) : null;
          result[key + 'Delta'] = deltaMatch ? num(deltaMatch[1]) : null;
          break;
        }
      }

      const totalEstimateMatch = text.match(/전체 예상 적립금\s*:\s*([\d,\.]+)\s*원/);
      const confirmedMatch = text.match(/확정 적립금\s*:\s*([\d,\.]+)\s*원/);
      result.totalEstimate = totalEstimateMatch ? num(totalEstimateMatch[1]) : null;
      result.totalConfirmed = confirmedMatch ? num(confirmedMatch[1]) : null;

      return result;
    }

    function fmt(n, unit) {
      if (n == null) return '-';
      const s = unit === '%' ? n.toFixed(2) : Math.round(n).toLocaleString('ko-KR');
      return s + unit;
    }

    let activeMetric = 'estimate';

    function render() {
      const reports = loadReports().sort((a, b) => a.date.localeCompare(b.date));
      const hasData = reports.length > 0;
      document.getElementById('dashboard').style.display = hasData ? 'block' : 'none';
      document.getElementById('emptyState').style.display = hasData ? 'none' : 'block';
      if (!hasData) return;

      const latest = reports[reports.length - 1];
      document.getElementById('latestDate').textContent = latest.date;
      document.getElementById('totalEstimate').textContent = fmt(latest.totalEstimate, '원');
      document.getElementById('totalConfirmed').textContent = fmt(latest.totalConfirmed, '원');

      const grid = document.getElementById('metricGrid');
      grid.innerHTML = METRICS.map(m => {
        const v = latest[m.key];
        const d = latest[m.key + 'Delta'];
        const deltaHtml = d == null ? '' : `<div class="delta ${d >= 0 ? 'up' : 'down'}">${d >= 0 ? '▲' : '▼'} ${Math.abs(d).toLocaleString('ko-KR')}%</div>`;
        return `<div class="metric-card"><div class="label">${m.label}</div><div class="value">${fmt(v, m.unit)}</div>${deltaHtml}</div>`;
      }).join('');

      const select = document.getElementById('metricSelect');
      select.innerHTML = METRICS.map(m =>
        `<button data-key="${m.key}" class="${m.key === activeMetric ? 'active' : ''}">${m.label}</button>`
      ).join('');
      select.querySelectorAll('button').forEach(btn => {
        btn.onclick = () => { activeMetric = btn.dataset.key; render(); };
      });

      drawChart(reports);

      const body = document.getElementById('logBody');
      body.innerHTML = reports.slice().reverse().map(r => `
        <tr>
          <td>${r.date}</td>
          <td>${fmt(r.estimate, '원')}</td>
          <td>${fmt(r.requests, '')}</td>
          <td>${fmt(r.impressions, '')}</td>
          <td>${fmt(r.clicks, '')}</td>
          <td>${fmt(r.ctr, '%')}</td>
          <td>${fmt(r.ecpm, '원')}</td>
          <td><button class="delete-btn" data-date="${r.date}">삭제</button></td>
        </tr>
      `).join('');
      body.querySelectorAll('.delete-btn').forEach(btn => {
        btn.onclick = () => {
          const list = loadReports().filter(r => r.date !== btn.dataset.date);
          saveReports(list);
          render();
        };
      });
    }

    function drawChart(reports) {
      const canvas = document.getElementById('adfitChart');
      const dpr = window.devicePixelRatio || 1;
      const rect = canvas.getBoundingClientRect();
      const w = rect.width, h = canvas.clientHeight || 280;
      canvas.width = w * dpr; canvas.height = h * dpr;
      const ctx = canvas.getContext('2d');
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
      ctx.clearRect(0, 0, w, h);

      const metric = METRICS.find(m => m.key === activeMetric);
      const points = reports.map(r => ({ date: r.date, value: r[metric.key] })).filter(p => p.value != null);
      if (points.length === 0) return;

      const isDark = document.documentElement.getAttribute('data-theme') === 'dark';
      const gridColor = isDark ? 'rgba(255,255,255,0.08)' : 'rgba(0,0,0,0.08)';
      const textColor = isDark ? '#9a9ab0' : '#6b7280';

      const padL = 48, padR = 12, padT = 16, padB = 28;
      const plotW = w - padL - padR, plotH = h - padT - padB;

      const values = points.map(p => p.value);
      let min = Math.min(...values), max = Math.max(...values);
      if (min === max) { min -= 1; max += 1; }
      const margin = (max - min) * 0.1;
      min -= margin; max += margin;

      ctx.strokeStyle = gridColor; ctx.fillStyle = textColor;
      ctx.font = '11px -apple-system, sans-serif';
      ctx.lineWidth = 1;
      const ySteps = 4;
      for (let i = 0; i <= ySteps; i++) {
        const y = padT + (plotH / ySteps) * i;
        ctx.beginPath(); ctx.moveTo(padL, y); ctx.lineTo(w - padR, y); ctx.stroke();
        const val = max - ((max - min) / ySteps) * i;
        ctx.textAlign = 'right'; ctx.textBaseline = 'middle';
        ctx.fillText(Math.round(val).toLocaleString('ko-KR'), padL - 6, y);
      }

      const xStep = points.length > 1 ? plotW / (points.length - 1) : 0;
      const coords = points.map((p, i) => ({
        x: padL + xStep * i,
        y: padT + plotH - ((p.value - min) / (max - min)) * plotH,
      }));

      ctx.strokeStyle = metric.color; ctx.lineWidth = 2;
      ctx.beginPath();
      coords.forEach((c, i) => i === 0 ? ctx.moveTo(c.x, c.y) : ctx.lineTo(c.x, c.y));
      ctx.stroke();

      const grad = ctx.createLinearGradient(0, padT, 0, padT + plotH);
      grad.addColorStop(0, metric.color + '33');
      grad.addColorStop(1, metric.color + '00');
      ctx.fillStyle = grad;
      ctx.beginPath();
      coords.forEach((c, i) => i === 0 ? ctx.moveTo(c.x, c.y) : ctx.lineTo(c.x, c.y));
      ctx.lineTo(coords[coords.length - 1].x, padT + plotH);
      ctx.lineTo(coords[0].x, padT + plotH);
      ctx.closePath(); ctx.fill();

      ctx.fillStyle = metric.color;
      coords.forEach(c => { ctx.beginPath(); ctx.arc(c.x, c.y, 3, 0, Math.PI * 2); ctx.fill(); });

      ctx.fillStyle = textColor; ctx.textAlign = 'center'; ctx.textBaseline = 'top';
      const labelEvery = Math.ceil(points.length / 6) || 1;
      points.forEach((p, i) => {
        if (i % labelEvery !== 0 && i !== points.length - 1) return;
        const label = p.date.slice(5).replace('-', '/');
        ctx.fillText(label, coords[i].x, padT + plotH + 6);
      });
    }

    document.getElementById('parseBtn').onclick = () => {
      const text = document.getElementById('reportInput').value.trim();
      const msg = document.getElementById('parseMsg');
      if (!text) { msg.textContent = '리포트 내용을 붙여넣어주세요.'; return; }
      const parsed = parseReport(text);
      if (!parsed) { msg.textContent = '조회일을 찾을 수 없어요. 형식을 확인해주세요.'; return; }
      const list = loadReports().filter(r => r.date !== parsed.date);
      list.push(parsed);
      saveReports(list);
      document.getElementById('reportInput').value = '';
      msg.textContent = `${parsed.date} 리포트를 저장했어요.`;
      render();
    };

    document.getElementById('clearBtn').onclick = () => {
      if (!confirm('저장된 모든 리포트를 삭제할까요?')) return;
      saveReports([]);
      render();
    };

    window.addEventListener('resize', () => { if (loadReports().length) drawChart(loadReports().sort((a,b)=>a.date.localeCompare(b.date))); });

    render();
  </script>
  <script type="text/javascript" src="//t1.kakaocdn.net/kas/static/ba.min.js" async></script>
</body>
