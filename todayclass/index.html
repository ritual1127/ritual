  <script src="../neis-common.js?v=20260925a"></script>
  <script>
    (() => {
      const $ = id => document.getElementById(id);
      const DAYS = ['월', '화', '수', '목', '금'];
      const el = (tag, props = {}) => Object.assign(document.createElement(tag), props);
      const dayOf = date => new Date(date.getFullYear(), date.getMonth(), date.getDate());
      const addDays = (date, days) => new Date(date.getFullYear(), date.getMonth(), date.getDate() + days);
      const clampInt = (value, min, max) => Math.min(max, Math.max(min, Math.round(Number(value)) || min));
      let school = null;
      let currentDate = dayOf(new Date());
      let view = 'day';
      try { view = localStorage.getItem('neisTimetableMode') === 'week' ? 'week' : 'day'; } catch {}
      let requestId = 0;

      const status = text => $('timetable').replaceChildren(el('p', { className: 'status', textContent: text }));

      function renderRange() {
        const today = dayOf(new Date());
        document.querySelectorAll('[data-view]').forEach(button => button.setAttribute('aria-pressed', String(button.dataset.view === view)));
        $('prevBtn').setAttribute('aria-label', view === 'week' ? '지난주' : '전날');
        $('nextBtn').setAttribute('aria-label', view === 'week' ? '다음 주' : '다음날');
        let main, sub, isCurrent;
        if (view === 'week') {
          const monday = mondayOf(currentDate);
          const friday = addDays(monday, 4);
          main = `${monday.getMonth() + 1}/${monday.getDate()} ~ ${friday.getMonth() + 1}/${friday.getDate()}`;
          isCurrent = +mondayOf(today) === +monday;
          sub = isCurrent ? '이번 주' : '';
        } else {
          const offset = Math.round((currentDate - today) / 86400000);
          main = neisDateLabel(currentDate);
          isCurrent = offset === 0;
          sub = { '-1': '어제', 0: '오늘', 1: '내일' }[offset] || '';
        }
        $('rangeLabel').replaceChildren(main, el('span', { className: 'date-sub', textContent: sub }));
        $('todayBtn').hidden = isCurrent;
      }

      function renderDay(periods) {
        if (!periods.length) return status('이 날은 시간표 정보가 없어요. (주말·방학 등)');
        const list = el('ol', { className: 'period-list' });
        list.append(...periods.map(({ period, subject }) => {
          const item = el('li');
          item.append(el('span', { className: 'period-no', textContent: `${period}교시` }), el('span', { textContent: subject }));
          return item;
        }));
        $('timetable').replaceChildren(list);
      }

      function renderWeek(byDate, monday) {
        const dates = DAYS.map((_, i) => addDays(monday, i));
        const lists = dates.map(date => byDate[neisYmd(date)] || []);
        const maxPeriod = Math.max(0, ...lists.flat().map(p => p.period));
        if (!maxPeriod) return status('이번 주 시간표 정보가 없어요. (방학 등)');
        const todayYmd = neisYmd(new Date());
        const table = el('table', { className: 'table week-table' });
        const head = el('tr');
        head.append(el('th', { scope: 'col', textContent: '교시' }), ...dates.map((date, i) => el('th', {
          scope: 'col', className: neisYmd(date) === todayYmd ? 'is-today' : '', textContent: `${DAYS[i]} ${date.getMonth() + 1}/${date.getDate()}`
        })));
        table.append(el('caption', { className: 'sr-only', textContent: '주간 시간표' }), el('thead'));
        table.tHead.append(head);
        const body = el('tbody');
        for (let period = 1; period <= maxPeriod; period++) {
          const row = el('tr');
          row.append(el('td', { textContent: String(period) }), ...lists.map((list, i) => el('td', {
            className: neisYmd(dates[i]) === todayYmd ? 'is-today' : '',
            textContent: list.find(p => p.period === period)?.subject || ''
          })));
          body.append(row);
        }
        table.append(body);
        const wrap = el('div', { className: 'table-wrap' });
        wrap.append(table);
        $('timetable').replaceChildren(wrap);
      }

      async function load() {
        if (!school) return;
        const grade = clampInt($('gradeInput').value, 1, 6);
        const classNum = clampInt($('classInput').value, 1, 30);
        const department = $('deptInput').value.trim();
        saveNeisClass({ grade, classNum, department });
        renderRange();
        status('불러오는 중…');
        const id = ++requestId;
        try {
          if (view === 'week') {
            const monday = mondayOf(currentDate);
            const byDate = await fetchNeisWeekTimetable(school, monday, grade, classNum, department);
            if (id === requestId) renderWeek(byDate, monday);
          } else {
            const { periods } = await fetchNeisTimetable(school, neisYmd(currentDate), grade, classNum, department);
            if (id === requestId) renderDay(periods);
          }
        } catch {
          if (id === requestId) status('시간표를 불러오지 못했어요. 잠시 후 다시 시도해 주세요.');
        }
      }

      ['gradeInput', 'classInput', 'deptInput'].forEach(id => $(id).addEventListener('change', load));
      document.querySelectorAll('[data-view]').forEach(button => button.addEventListener('click', () => {
        view = button.dataset.view;
        try { localStorage.setItem('neisTimetableMode', view); } catch {}
        load();
      }));
      $('prevBtn').onclick = () => { currentDate = addDays(currentDate, view === 'week' ? -7 : -1); load(); };
      $('nextBtn').onclick = () => { currentDate = addDays(currentDate, view === 'week' ? 7 : 1); load(); };
      $('todayBtn').onclick = () => { currentDate = dayOf(new Date()); load(); };

      renderSchoolPicker($('schoolPicker'), picked => {
        school = picked;
        $('classBox').hidden = !picked;
        document.title = picked ? `오늘의 시간표 - ${picked.schoolName} 시간표 | 성적 계산기` : '오늘의 시간표 - 우리학교 시간표 조회 | 성적 계산기';
        if (!picked) return;
        const saved = loadNeisClass();
        $('gradeInput').value = saved.grade || 1;
        $('classInput').value = saved.classNum || 1;
        $('deptInput').value = saved.department || '';
        $('deptField').hidden = picked.kind !== 'HIGH';
        load();
      });
    })();
  </script>
