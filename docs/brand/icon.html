<!doctype html>
<meta charset="utf-8">
<meta name="robots" content="noindex">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/pretendard@1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<style>
  html, body { margin: 0; background: transparent; }
  svg { display: block; transform: translateZ(0); }
</style>
<body>
<script src="brand-logo.js"></script>
<script>
  // ?size-shape : shape = square(풀블리드, 마스커블 안전영역) | round(파비콘, iOS 아이콘 모서리)
  const [size, shape] = location.search.slice(1).split('-');
  document.body.innerHTML = brandLogo(shape === 'round' ? 115 : 0).replace('<svg ', `<svg width="${size}" height="${size}" `);
</script>
</body>
